server.port=8082

spring.datasource.url=jdbc:postgresql://localhost:5432/loan
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Circuit Breaker "biblioteca"
resilience4j.circuitbreaker.instances.biblioteca.sliding-window-size=5
resilience4j.circuitbreaker.instances.biblioteca.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.biblioteca.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.biblioteca.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.biblioteca.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.biblioteca.register-health-indicator=true

# Actuator: expõe o estado do circuit breaker
management.endpoints.web.exposure.include=health,circuitbreakers
management.endpoint.health.show-details=always

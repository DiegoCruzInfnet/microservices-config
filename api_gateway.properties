server.port=8765

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

spring.cloud.gateway.routes[0].id=biblioteca-books
spring.cloud.gateway.routes[0].uri=lb://Biblioteca
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/books/**
#spring.cloud.gateway.routes[0].filters[0]=RewritePath=/api/books/?(?<segment>.*), /book/${segment}
spring.cloud.gateway.routes[0].filters[0]=RewritePath=/api/books(?<segment>/?.*), /book${segment}

spring.cloud.gateway.routes[1].id=biblioteca-users
spring.cloud.gateway.routes[1].uri=lb://Biblioteca
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/users/**
spring.cloud.gateway.routes[1].filters[0]=RewritePath=/api/users/?(?<segment>.*), /user/${segment}

spring.cloud.gateway.routes[2].id=loan-service
spring.cloud.gateway.routes[2].uri=lb://loan-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/loans/**
spring.cloud.gateway.routes[2].filters[0]=RewritePath=/api/loans/?(?<segment>.*), /loan/${segment}

spring.cloud.gateway.routes[3].id=avaliacao-service
spring.cloud.gateway.routes[3].uri=lb://avaliacao-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/avaliacoes/**
spring.cloud.gateway.routes[3].filters[0]=RewritePath=/api/avaliacoes/?(?<segment>.*), /avaliacao/${segment}
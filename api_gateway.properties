server.port=8765

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

spring.cloud.gateway.routes[0].id=biblioteca
spring.cloud.gateway.routes[0].uri=lb://Biblioteca
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/books/**,/api/users/**

spring.cloud.gateway.routes[1].id=loan-service
spring.cloud.gateway.routes[1].uri=lb://loan-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/loans/**

spring.cloud.gateway.routes[2].id=avaliacao-service
spring.cloud.gateway.routes[2].uri=lb://avaliacao-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/avaliacoes/**
